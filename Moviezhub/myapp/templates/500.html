<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 – Server Error</title>
    <style>
        body {
            background: radial-gradient(circle at top right, #1a1a1a, #050505);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }

        .card {
            background: rgba(20,20,20,.7);
            border-radius: 30px;
            padding: 50px;
            max-width: 500px;
            text-align: center;
            color: white;
            box-shadow: 0 40px 80px rgba(0,0,0,.8);
        }

        .code {
            font-size: 6rem;
            color: #ff4d4d;
            opacity: .2;
            font-weight: 900;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            border-radius: 50px;
            background: linear-gradient(45deg, #ffd700, #b8860b);
            color: #000;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>Technical Intermission</h1>
        <p>Something went wrong on our side. Please try again shortly.</p>
        <a href="/">Return to Lobby</a>
    </div>
</body>
</html>
