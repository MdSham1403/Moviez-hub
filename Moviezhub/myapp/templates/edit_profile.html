{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Premium High-Gloss Dark Theme */
    body {
        background: radial-gradient(circle at top right, #1a1a1a, #050505);
        min-height: 100vh;
        font-family: 'Poppins', sans-serif;
        color: #fff;
        margin: 0;
        padding: 0;
    }

    .edit-profile-container {
        display: flex;
        justify-content: center;
        padding: 40px 15px; /* Reduced padding for mobile */
    }

    .rich-edit-card {
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 215, 0, 0.15);
        border-radius: 40px;
        padding: 50px;
        width: 100%;
        max-width: 650px;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
        box-sizing: border-box;
    }

    .rich-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .rich-header h2 {
        font-size: 2.2rem;
        font-weight: 800;
        background: linear-gradient(to bottom, #fff 40%, #ffd700);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
        margin-bottom: 5px;
    }

    .rich-subtitle {
        color: rgba(255, 215, 0, 0.6);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 4px;
    }

    .field-wrapper {
        margin-bottom: 25px;
    }

    .field-wrapper label {
        display: block;
        color: #777;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 8px;
        margin-left: 10px;
    }

    .field-wrapper input {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 14px 20px;
        color: #fff;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
    }

    .field-wrapper input:focus {
        border-color: #ffd700;
        background: rgba(255, 215, 0, 0.02);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
    }

    .image-edit-section {
        background: rgba(255, 255, 255, 0.02);
        padding: 20px;
        border-radius: 25px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 35px;
    }

    .preview-img {
        width: 85px;
        height: 85px;
        object-fit: cover;
        border-radius: 20px;
        border: 2px solid rgba(255, 215, 0, 0.4);
        flex-shrink: 0;
    }

    .file-input-custom {
        font-size: 0.75rem;
        color: #666;
        width: 100%;
    }
    
    .file-input-custom::file-selector-button {
    background: linear-gradient(135deg, #ffd700, #ffb700);
    color: #1a1a1a;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.65rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
    }

    .file-input-custom::file-selector-button:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
    }

    /* ONLY the "No file chosen" text */
    .file-input-custom {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.65rem;
    }

    /* ONLY Remove Image checkbox + label */
    #delete_profile_picture {
        accent-color: #ff4d4d;
        transform: scale(0.85);
        cursor: pointer;
    }

    label[for="delete_profile_picture"] {
        cursor: pointer;
        font-size: 0.65rem;
    }

    .btn-gold {
        background: #ffd700;
        color: #000;
        border: none;
        border-radius: 18px;
        padding: 16px 30px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
        cursor: pointer;
        width: 100%;
        margin-bottom: 15px;
        font-size: 1rem;
    }

    .btn-gold:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(255, 215, 0, 0.3);
        background: #fff;
    }

    .action-row {
        display: flex;
        gap: 12px;
        margin-bottom: 30px;
    }

    .action-btn {
        flex: 1;
        padding: 14px 10px;
        font-size: 0.7rem;
        font-weight: 600;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-align: center;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
    }

    .action-btn:hover {
        border-color: #ffd700;
        color: #ffd700;
        background: rgba(255, 215, 0, 0.05);
    }

    .danger-zone {
        margin-top: 10px;
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        justify-content: center;
        text-align: center;
    }

    .danger-link {
        color: rgba(255, 77, 77, 0.4);
        font-size: 0.7rem;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
    }

    .danger-link:hover {
        color: #ff4d4d;
    }
/* Add this to your CSS for the Cropper Modal */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center;
    }
    .cropper-container-box {
        background: #1a1a1a; padding: 20px; border-radius: 15px; max-width: 90%; width: 500px;
    }
    .crop-preview-area { max-height: 400px; margin-bottom: 20px; }
    .btn-crop-confirm { background: #ffd700; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
    
    /* Improve your existing file input styling */
    .file-input-wrapper { position: relative; overflow: hidden; }
    /* --- MOBILE RESPONSIVENESS --- */
/* --- POCO X7 & MOBILE OPTIMIZATION --- */
    @media (max-width: 550px) {
        .edit-profile-container {
            padding: 20px 10px; /* Wider card by reducing container padding */
        }

        .rich-edit-card {
            padding: 35px 20px; /* More room for inputs */
            border-radius: 30px;
            width: 100%;
        }

        .rich-header h2 {
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }

        /* Keep image and file input row-based unless very narrow */
        .image-edit-section {
            padding: 15px;
            gap: 15px;
            flex-direction: row; /* Keep it horizontal for the "Studio" feel */
            text-align: left;
        }

        .preview-img {
            width: 70px;
            height: 70px;
            border-radius: 15px;
        }

        .file-input-custom {
            font-size: 0.6rem;
        }

        /* Action Buttons: 2x2 Grid looks better than a long list on high-res screens */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 12px 5px;
            font-size: 0.65rem;
        }

        /* Full width for the main button */
        .btn-gold {
            padding: 16px;
            font-size: 0.9rem;
            border-radius: 15px;
        }

        .field-wrapper input {
            padding: 12px 15px;
            font-size: 0.9rem; /* Prevent iOS/Android auto-zoom on focus */
        }
    }

    /* Extra narrow fix for very small font settings */
    @media (max-width: 380px) {
        .image-edit-section {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .action-row {
            grid-template-columns: 1fr; /* Stack only on very tiny widths */
        }
    }
    /* 🌀 Premium Loading Overlay */
    .submit-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
        z-index: 2000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .spinner-gold {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255, 215, 0, 0.1);
        border-top: 3px solid var(--gold, #ffd700);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-text {
        color: var(--gold, #ffd700);
        font-family: 'Cinzel', serif;
        letter-spacing: 2px;
        font-size: 0.8rem;
    }

    /* Disable button state */
    .btn-gold:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    /* 🌀 Spinner & Modal Styles */
    .submit-overlay, .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); z-index: 2000;
        flex-direction: column; align-items: center; justify-content: center;
    }
    .spinner-gold {
        width: 50px; height: 50px; border: 3px solid rgba(255, 215, 0, 0.1);
        border-top: 3px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .cropper-box { background: #1a1a1a; padding: 20px; border-radius: 15px; width: 90%; max-width: 450px; text-align: center; }
    .crop-area { max-height: 350px; overflow: hidden; margin-bottom: 15px; background: #000; }
    #image-to-crop { max-width: 100%; }
</style>

<div class="edit-profile-container">
    <div class="rich-edit-card">
        <div class="rich-header">
            <h2>Account Studio</h2>
            <span class="rich-subtitle">Design Your Identity</span>
        </div>

        <form method="post" enctype="multipart/form-data" id="profile-form">
            {% csrf_token %}
            
            <div class="field-wrapper">
                <label>Legal Identity</label>
                <input type="text" name="first_name" value="{{ user_form.instance.first_name }}" placeholder="Full Name">
            </div>

            <div class="field-wrapper">
                <label>Verified Email Address</label>
                <input type="email" name="email" value="{{ user_form.instance.email }}" placeholder="mail@example.com">
            </div>

            <div class="field-wrapper">
                <label>User Name</label>
                <input type="text" name="username" value="{{ user_form.instance.username }}">
            </div>

            <label class="field-wrapper" style="color:#ffd700; font-size: 0.65rem; margin-bottom: 10px;">Visual Avatar</label>
            <div class="image-edit-section">
                <img src="{% if user.profile.profile_picture %}{{ user.profile.profile_picture.url }}{% else %}{% static "https://res.cloudinary.com/dx6cvs9dk/image/upload/v1771509734/default-profile.jpg" %}{% endif %}" 
     alt="Profile" 
     class="preview-img" 
     id="avatar-preview"
     onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name={{ user.username }}&background=1a1a1a&color=ffd700&size=128';">
                
                <div class="file-input-wrapper">
                    <input type="file" id="avatar-input" accept="image/*" class="file-input-custom mb-1">
                    <input type="hidden" name="cropped_image" id="cropped-image-data">

                    {% if user.profile.profile_picture %}
                    <div style="font-size: 0.65rem; color: rgba(255, 77, 77, 0.7); margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px;">
                        <input type="checkbox" name="delete_profile_picture" id="delete_profile_picture"> 
                        <label for="delete_profile_picture" style="margin:0; color:inherit; text-transform:none; letter-spacing: 0;">Remove Image</label>
                    </div>
                    {% endif %}
                </div>
            </div>

            <button type="submit" class="btn-gold">Update Identity</button>

            <div class="action-row">
                <a href="{% url 'home' %}" class="action-btn">✦ Home</a>
                <a href="{% url 'profile' %}" class="action-btn">👤 Profile</a>
                <a href="{% url 'change_password' %}" class="action-btn">🛡 Credentials</a>
            </div>
        </form>
    </div>
</div>

<div id="cropper-modal" class="modal-overlay">
    <div class="cropper-box">
        <div class="crop-area"><img id="image-to-crop"></div>
        <button type="button" id="apply-crop" class="btn-gold" style="width:100%">Confirm Crop</button>
    </div>
</div>

<div id="loading-overlay" class="submit-overlay">
    <div class="spinner-gold"></div>
    <div style="color:#ffd700; margin-top:15px; font-size:0.7rem; letter-spacing:2px">UPLOADING TO VAULT...</div>
</div>
<script>document.addEventListener("DOMContentLoaded", function() {
    const avatarInput = document.getElementById('avatar-input');
    const avatarPreview = document.getElementById('avatar-preview');
    const cropperModal = document.getElementById('cropper-modal');
    const imageToCrop = document.getElementById('image-to-crop');
    const applyCropBtn = document.getElementById('apply-crop');
    const croppedDataInput = document.getElementById('cropped-image-data');
    const profileForm = document.getElementById('profile-form');
    const loadingOverlay = document.getElementById('loading-overlay');
    const submitBtn = document.querySelector('.btn-gold');
    let cropper;

    // 1. Detect Image Selection
    avatarInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imageToCrop.src = event.target.result;
                cropperModal.style.display = 'flex';
                if (cropper) cropper.destroy();
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: 1,
                    viewMode: 1,
                });
            };
            reader.readAsDataURL(file);
        }
    });

    // 2. Apply the Crop
    applyCropBtn.addEventListener('click', function() {
        const canvas = cropper.getCroppedCanvas({ width: 400, height: 400 });
        const base64Image = canvas.toDataURL('image/jpeg');
        
        croppedDataInput.value = base64Image; // Store in hidden input
        avatarPreview.src = base64Image; // Show user the result
        cropperModal.style.display = 'none';
        cropper.destroy();
    });

    // 3. Handle Submit & Loading Spinner
    profileForm.addEventListener('submit', function() {
        loadingOverlay.style.display = 'flex';
        submitBtn.disabled = true;
        submitBtn.innerText = "SAVING...";
    });
});
</script>
{% endblock %}
