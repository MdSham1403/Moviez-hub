{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* 🌌 Background */
    .welcome-container {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #050505; /* Deep black for better glow */
    }

    /* 💎 Box with Gold Glow */
    .welcome-card {
        background: #111;
        border: 1px solid #222;
        border-radius: 20px;
        padding: 50px;
        max-width: 850px;
        width: 95%;
        display: flex;
        flex-direction: row;
        /* This adds the soft gold glow around the whole box */
        box-shadow: 0 0 40px rgba(255, 202, 40, 0.1); 
    }

    /* 🛡️ Left Side: Logo */
    .left-section {
        width: 50%;
        padding-right: 30px;
        border-right: 1px solid #222;
        display: flex;
        align-items: center;
        justify-content: center;
    }

   .welcome-logo {
    max-width: 65%; /* Elegant smaller size */
    height: auto;
    border-radius: 20px; /* This creates the curved corners */
    border: 1px solid rgba(255, 255, 255, 0.1); /* Very light border to show the curves */
    display: block;
}
    /* 🔑 Right Side: Text & Buttons */
    .right-section {
        width: 50%;
        padding-left: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .welcome-title {
        color: #ffca28; /* Simple Gold */
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(255, 202, 40, 0.3);
    }

    .welcome-description {
        color: #aaa;
        font-size: 1rem;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    /* 🔘 Buttons */
    .btn-custom {
        padding: 12px;
        font-weight: bold;
        border-radius: 10px;
        text-decoration: none;
        text-align: center;
        font-size: 1rem;
        transition: 0.3s;
    }

    .btn-login {
        background-color: #ffca28;
        color: #000;
        margin-bottom: 15px;
        box-shadow: 0 4px 15px rgba(255, 202, 40, 0.2);
    }

    .btn-login:hover {
        background-color: #fff;
        transform: translateY(-2px);
    }

    .btn-signup {
        background-color: transparent;
        color: #fff;
        border: 1px solid #444;
    }

    .btn-signup:hover {
        border-color: #ffca28;
        color: #ffca28;
    }

    /* Mobile View */
    @media (max-width: 768px) {
        .welcome-card {
            flex-direction: column;
            text-align: center;
            padding: 30px;
        }
        .left-section {
            width: 100%;
            border-right: none;
            border-bottom: 1px solid #222;
            padding-bottom: 30px;
            margin-bottom: 30px;
        }
        .welcome-logo {
            max-width: 50%; /* Even smaller on mobile */
        }
        .right-section {
            width: 100%;
            padding: 0;
        }
    }
</style>

<div class="welcome-container">
    <div class="welcome-card">
        
        <div class="left-section">
            <img src="{% static 'images/logo.png' %}" alt="Logo" class="welcome-logo">
        </div>

        <div class="right-section">
            <h1 class="welcome-title">Welcome to Moviezhub</h1>
            <p class="welcome-description">
                The best place for movies and series. <br>
                Sign in to start watching!
            </p>
            
            <div class="d-grid">
                <a href="{% url 'login' %}" class="btn-custom btn-login">
                    Login
                </a>
                <a href="{% url 'register' %}" class="btn-custom btn-signup">
                    Create an Account
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
