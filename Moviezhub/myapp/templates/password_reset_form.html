{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* 🔐 Security Gateway Layout */
    .pwd-reset-container {
        min-height: 85vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .glass-reset-card {
        background: var(--slate-glass);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        padding: 45px;
        max-width: 450px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }

    .reset-icon {
        font-size: 3rem;
        color: var(--gold);
        margin-bottom: 20px;
        filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
    }

    .pwd-reset-heading {
        font-family: 'Cinzel', serif;
        color: #fff;
        letter-spacing: 2px;
        margin-bottom: 15px;
        text-transform: uppercase;
    }

    .pwd-reset-subtext {
        color: #aaa;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    /* 📋 Form & Input Styling */
    .pwd-reset-form p {
        text-align: left;
    }

    .pwd-reset-form label {
        display: block;
        color: var(--gold);
        font-family: 'Montserrat', sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        margin-left: 5px;
    }

    /* Targeting the email input specifically */
    .pwd-reset-form input[type="email"], 
    .pwd-reset-form input {
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid #444 !important;
        color: #fff !important;
        border-radius: 12px !important;
        padding: 14px !important;
        width: 100%;
        transition: 0.3s ease;
    }

    .pwd-reset-form input:focus {
        border-color: var(--gold) !important;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.2) !important;
        outline: none;
    }

    /* 🚀 Action Buttons */
    .btn-reset-vault {
        background: var(--gold);
        color: #000;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 15px;
        border-radius: 12px;
        width: 100%;
        border: none;
        margin-top: 10px;
        transition: 0.4s;
    }

    .btn-reset-vault:hover {
        background: #fff;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .back-link {
        display: inline-block;
        margin-top: 25px;
        color: var(--gold);
        text-decoration: none;
        font-size: 0.85rem;
        transition: 0.3s;
        opacity: 0.8;
    }

    .back-link:hover {
        opacity: 1;
        letter-spacing: 1px;
    }
</style>

<div class="pwd-reset-container">
    <div class="glass-reset-card">
        <div class="reset-icon">
            <i class="fas fa-key"></i>
        </div>
        
        <h2 class="pwd-reset-heading">Identity Verification</h2>
        
        <p class="pwd-reset-subtext">
            Enter your authorized email address to receive a secure recovery link for your vault access.
        </p>

        <form method="post" class="pwd-reset-form">
            {% csrf_token %}
            
            <div class="mb-4">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-reset-vault">
                Initiate Recovery
            </button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            <i class="fas fa-arrow-left me-1"></i> BACK TO LOGIN
        </a>
    </div>
</div>
{% endblock %}
