{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .success-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .glass-success-card {
        background: var(--slate-glass);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(40, 167, 69, 0.3); /* Subtle green border */
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .success-icon {
        font-size: 4rem;
        color: #28a745;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 10px rgba(40, 167, 69, 0.4));
    }

    .success-title {
        font-family: 'Cinzel', serif;
        color: #fff;
        letter-spacing: 2px;
        margin-bottom: 15px;
    }

    .success-text {
        color: #bbb;
        font-size: 1.05rem;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .btn-vault-login {
        background: #28a745;
        color: white !important;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 12px 30px;
        border-radius: 50px;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
        border: none;
    }

    .btn-vault-login:hover {
        background: #218838;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }
</style>

<div class="success-container">
    <div class="glass-success-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h2 class="success-title">ACCESS RESTORED</h2>
        
        <p class="success-text">
            Your credentials have been successfully updated in the vault. 
            You may now proceed to log in with your new password.
        </p>

        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn-vault-login">
                <i class="fas fa-sign-in-alt me-2"></i> SECURE LOGIN
            </a>
        </div>
        
        <div class="mt-4">
            <a href="{% url 'home' %}" class="text-muted small text-decoration-none">
                <i class="fas fa-chevron-left me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
