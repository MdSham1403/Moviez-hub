{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* =========================================
       1. GLOBAL PAGE SETUP 
    ========================================= */
    .explore-section {
        padding: 40px 15px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: radial-gradient(circle at top right, #1a1a1a, #080808);
        color: white;
    }

    .top-nav-row {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto 40px;
        display: flex;
        justify-content: flex-start;
    }

    .btn-home-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
        opacity: 0.8;
    }

    .btn-home-link:hover {
        color: #ffca28;
        opacity: 1;
    }

    /* Centralizes the content blocks */
    .view-wrapper {
        flex: 1;
        display: flex;
        align-items: center; 
        justify-content: center;
        width: 100%;
    }

    /* =========================================
       2. CHOICE CARDS (GATEWAY)
    ========================================= */
    .gateway-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
        width: 100%;
        max-width: 850px;
        animation: fadeIn 0.5s ease;
    }

    .gateway-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-radius: 24px;
        padding: 60px 20px;
        text-align: center;
        text-decoration: none !important;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        backdrop-filter: blur(10px);
    }

    .gateway-card:hover {
        background: rgba(255, 215, 0, 0.08);
        border-color: #ffca28;
        transform: translateY(-10px);
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
    }

    .gateway-icon {
        font-size: 3rem;
        color: #ffca28;
        margin-bottom: 15px;
        display: block;
    }

    .gateway-card h3 {
        color: #ffffff; 
        font-size: 1.3rem;
        margin-bottom: 8px;
        font-weight: 700;
    }

    .gateway-card p {
        color: #dddddd; 
        font-size: 0.9rem;
        margin: 0;
    }

    /* =========================================
       3. LANGUAGE VIEW
    ========================================= */
    #language-view {
        display: none;
        width: 100%;
        max-width: 1100px;
        animation: slideUp 0.5s ease forwards;
    }

    .explore-title {
        font-family: 'Cinzel', serif;
        color: #ffca28;
        font-size: 2.8rem;
        font-weight: 800;
        letter-spacing: 2px;
        text-align: center;
        margin-bottom: 5px;
    }

    .explore-subtitle {
        color: rgba(255,255,255,0.7); 
        text-align: center;
        margin-bottom: 40px;
        font-size: 1rem;
    }

    .language-orb {
        width: 140px;
        height: 140px;
        margin: 0 auto;
        border-radius: 50%;
        border: 2px solid rgba(255, 215, 0, 0.2);
        padding: 8px;
        transition: 0.4s;
        background: rgba(255,255,255,0.03);
        overflow: hidden;
    }

    .language-orb img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
    }

    .language-link:hover .language-orb {
        border-color: #ffca28;
        transform: scale(1.1) rotate(3deg);
        box-shadow: 0 0 30px rgba(255, 202, 40, 0.4);
    }

    .language-name-text {
        color: #ddd;
        margin-top: 15px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 0.8rem;
        text-align: center;
    }

    .btn-back {
        background: transparent;
        color: #ffca28;
        border: 1px solid #ffca28;
        padding: 10px 25px;
        border-radius: 50px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }

    .btn-back:hover {
        background: #ffca28;
        color: #000;
    }

    /* =========================================
       4. MOBILE RESPONSIVENESS (Merged)
    ========================================= */
    @media (max-width: 768px) {
        .explore-section { padding: 20px 15px 60px; }
        
        .top-nav-row { 
            justify-content: center !important; 
            margin-bottom: 25px; 
        }

        .btn-home-link {
            padding: 12px 25px;
            background: rgba(20, 20, 20, 0.8);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            opacity: 1;
        }

        .gateway-container { 
            grid-template-columns: 1fr; 
            gap: 20px;
            padding: 0 10px;
        }

        .gateway-card { padding: 40px 20px; }

        .explore-title { font-size: 1.8rem; }

        .language-orb {
            width: 100px;
            height: 100px;
        }
    }

    /* =========================================
       5. ANIMATIONS
    ========================================= */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { 
        from { opacity: 0; transform: translateY(30px); } 
        to { opacity: 1; transform: translateY(0); } 
    }
</style>

<div class="container explore-section">
    <div class="top-nav-row">
        <a href="{% url 'home' %}" class="btn-home-link">
            <i class="fas fa-home"></i> Home
        </a>
    </div>
    
    <div class="view-wrapper">
        <div class="gateway-container" id="gateway-screen">
            <a href="{% url 'movies' %}" class="gateway-card">
                <i class="fas fa-layer-group gateway-icon"></i>
                <h3>All Movies</h3>
                <p>Browse the full archive</p>
            </a>

            <div onclick="showLanguages()" class="gateway-card" style="cursor: pointer;">
                <i class="fas fa-language gateway-icon"></i>
                <h3>By Language</h3>
                <p>Explore regional cinema</p>
            </div>
        </div>

        <div id="language-view">
            <div class="text-center mb-5">
                <h1 class="explore-title">The Language Vault</h1>
                <p class="explore-subtitle">Pick a language to start watching</p>
            </div>

            <div class="row justify-content-center g-4 mb-5">
                {% for language in languages %}
                <div class="col-6 col-md-4 col-lg-2">
                    <a href="{% url 'movies_by_language' language.name %}" class="language-link text-decoration-none d-block">
                        <div class="language-orb">
                            <img src="{% if language.image %}{% static language.image %}{% else %}{% static 'images/default_language.jpg' %}{% endif %}" alt="{{ language.name }}">
                        </div>
                        <div class="language-name-text">{{ language.name }}</div>
                    </a>
                </div>
                {% endfor %}
            </div>

            <div class="text-center">
                <button onclick="showGateways()" class="btn-back">
                    <i class="fas fa-chevron-left me-2"></i> Back to Choice
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function showLanguages() {
        document.getElementById('gateway-screen').style.display = 'none';
        document.getElementById('language-view').style.display = 'block';
    }

    function showGateways() {
        document.getElementById('gateway-screen').style.display = 'grid';
        document.getElementById('language-view').style.display = 'none';
    }
</script>
{% endblock %}
