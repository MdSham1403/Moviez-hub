{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* 🌌 Page Setup */
    body {
        background: radial-gradient(circle at top right, #1a1a1a, #080808);
        color: #ffffff;
        font-family: 'Montserrat', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px 15px;
        margin: 0;
    }

    /* 📺 Request Card - Glassmorphism */
    .request-card {
        background: rgba(20, 20, 20, 0.75);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 202, 40, 0.15);
        border-radius: 30px;
        padding: 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        box-sizing: border-box;
    }

    .form-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand-highlight {
        color: #ffca28;
        font-family: 'Cinzel', serif;
        display: block;
        font-size: 0.9rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .form-title {
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
    }

    /* 🖋️ Modern Input Styling */
    .input-group-custom {
        position: relative;
        margin-bottom: 25px;
    }

    .input-group-custom input, 
    .input-group-custom textarea {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid #333;
        border-radius: 12px;
        padding: 15px 18px;
        color: #fff;
        outline: none;
        transition: 0.3s;
        font-size: 16px; /* Prevents mobile zoom */
        font-family: inherit;
        box-sizing: border-box;
    }

    .input-group-custom textarea {
        min-height: 100px;
        resize: none;
    }

    .input-group-custom input:focus, 
    .input-group-custom textarea:focus {
        border-color: #ffca28;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(255, 202, 40, 0.1);
    }

    .input-group-custom label {
        position: absolute;
        left: 18px;
        top: 15px;
        color: #777;
        transition: 0.3s;
        pointer-events: none;
        font-size: 0.9rem;
    }

    /* Floating Label Logic */
    .input-group-custom input:focus ~ label,
    .input-group-custom input:valid ~ label,
    .input-group-custom textarea:focus ~ label,
    .input-group-custom textarea:valid ~ label {
        top: -10px;
        left: 12px;
        font-size: 0.75rem;
        color: #ffca28;
        background: #0d0d0d;
        padding: 0 8px;
    }

    /* 🚀 Action Button */
    .btn-submit {
        background: linear-gradient(45deg, #ffca28, #b8860b);
        color: #000;
        border: none;
        border-radius: 12px;
        padding: 16px;
        width: 100%;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 10px 20px rgba(184, 134, 11, 0.2);
    }

    .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(184, 134, 11, 0.4);
        filter: brightness(1.1);
    }

    /* 📱 Mobile Adjustments */
    @media (max-width: 480px) {
        body { padding-top: 20px; }
        .request-card {
            padding: 30px 20px;
            border-radius: 20px;
        }
        .form-title { font-size: 1.6rem; }
    }
</style>

<div class="request-card">
    <div class="form-header">
        <span class="brand-highlight">Elite Vault</span>
        <h2 class="form-title">🎬 Request Movie</h2>
    </div>

    <form method="post" autocomplete="off">
        {% csrf_token %}

        {% if user.is_authenticated %}
            <span class="status-msg">Logged in as <b>{{ user.username }}</b></span>
        {% endif %}

        <div class="input-group-custom">
            <input type="text" name="name" required>
            <label>Movie Name *</label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="input-group-custom">
                <input type="number" name="year">
                <label>Year</label>
            </div>
            <div class="input-group-custom">
                <input type="text" name="language">
                <label>Language</label>
            </div>
        </div>

        <div class="input-group-custom">
            <textarea name="details"></textarea>
            <label>Additional Details (1080p, Subtitles...)</label>
        </div>

        {% if not user.is_authenticated %}
        <div class="input-group-custom">
            <input type="email" name="email">
            <label>Your Email (To notify you)</label>
        </div>
        {% endif %}

        <button type="submit" class="btn-submit">Submit Request</button>
        
        <div class="text-center mt-4">
            <a href="{% url 'home' %}" style="color: #666; text-decoration: none; font-size: 0.8rem; letter-spacing: 1px;">
                <i class="fas fa-chevron-left"></i> RETURN TO HOME
            </a>
        </div>
    </form>
</div>
{% endblock %}
